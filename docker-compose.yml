services:
  kafka:
    image: apache/kafka:latest
    container_name: broker
    ports:
      - "9092:9092"

  
  rabbitmq:
    image: rabbitmq:4.3.6-management
    hostname: rabbitmq
    container_name: rabbitmq
    ports:
      - "5672:5672"

    environment:
      RABBITMQ_DEFAULT_USER: "app"
      RABBITMQ_DEFAULT_PASS: "secret"

  
  mongo:
    image: mongo:latest
    container_name: "mongo"
    ports:
      - "27071:27071"